[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-strategy-platform"
version = "0.1.0"
description = "Configuration-driven Kite market data, paper trading and backtesting platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0", "httpx>=0.27", "websocket-client>=1.8", "pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
kite-platform = "kite_strategy_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
